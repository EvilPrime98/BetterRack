name: PR body check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  no-claude-in-body:
    name: PR body must not mention "claude"
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$PR_BODY" | grep -qi 'claude'; then
            echo "::error::The PR description contains the word 'claude'. Remove it and edit the PR."
            exit 1
          fi
